name: FloridaArm64

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: "Frida version tag to build (blank = latest)"
        required: false
        default: ""

jobs:
  android_build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: "temurin"
        java-version: "17"

    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r29
        local-cache: false
        link-to-sdk: true

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    - name: install dependencies
      run: |
        sudo apt-get update && DEBIAN_FRONTEND=noninteractive sudo apt-get install build-essential tree ninja-build gcc-multilib g++-multilib lib32stdc++-9-dev flex bison ruby ruby-dev python3-requests python3-setuptools python3-dev python3-pip libc6-dev libc6-dev-i386 -y
        sudo gem install fpm -v 1.11.0 --no-document
        python3 -m pip install lief graphlib

    - name: Resolve frida version
      id: ver
      run: |
        if [ -n "${{ github.event.inputs.frida_version }}" ]; then
          echo "V=${{ github.event.inputs.frida_version }}" >> $GITHUB_OUTPUT
        else
          V=$(curl -s https://api.github.com/repos/frida/frida/releases/latest | grep -oE '"tag_name": *"[^"]*"' | head -1 | sed 's/.*"tag_name": *"//;s/"//')
          echo "V=$V" >> $GITHUB_OUTPUT
        fi

    - name: build frida-server (android-arm64) with Florida patches
      shell: bash
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        export ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
        echo "Building Frida ${{ steps.ver.outputs.V }} for android-arm64"
        git clone --recurse-submodules --branch ${{ steps.ver.outputs.V }} https://github.com/frida/frida || git clone --recurse-submodules https://github.com/frida/frida
        cd frida
        applied=0; skipped=0
        for path in ../patches/*; do
          name=$(basename $path)
          echo "=== subprojects/$name ==="
          cd subprojects/$name
          for p in ../../../patches/$name/*.patch; do
            bn=$(basename "$p")
            if git am --3way "$p"; then
              echo "APPLIED $bn"; applied=$((applied+1))
            else
              git am --abort 2>/dev/null || true
              if git apply --3way "$p" 2>/dev/null; then
                git add -A; git -c user.name=x -c user.email=x@x commit -q -m "apply $bn"; echo "APPLIED(apply3way) $bn"; applied=$((applied+1))
              else
                echo "SKIPPED $bn"; skipped=$((skipped+1))
              fi
            fi
          done
          cd ../..
        done
        cd ..
        echo "=== PATCH SUMMARY: applied=$applied skipped=$skipped ==="

    - name: build frida for Android (arm64)
      shell: bash
      run: |
        export ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
        mkdir build-android-arm64
        cd build-android-arm64
        ../frida/configure --host=android-arm64
        make
        cd ..
        ls -la build-android-arm64/subprojects/frida-core/server/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: florida-server-android-arm64
        path: build-android-arm64/subprojects/frida-core/server/frida-server
        if-no-files-found: error
